<form class="flex flex-col gap-4" (submit)="onSubmit($event)">
  <div appFormField>
    <label appLabel for="email">email address</label>
    <input
      appInput
      id="email"
      type="text"
      placeholder="email@example.com"
      [formField]="forgotPasswordForm.email"
      [error]="!!emailError()"
    />

    @if (emailError()) {
      <app-form-error [message]="emailError()!" />
    }
  </div>

  <button class="capitalize" appButton type="submit">send reset link</button>
</form>
