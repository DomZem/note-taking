<app-auth-view>
  <div appCard>
    <app-logo />

    <div class="flex flex-col gap-2 items-center">
      <h2 class="capitalize" appTextPreset1>create your account</h2>
      <p>Sign up to start organizing your notes and boost your productivity.</p>
    </div>

    <div class="pt-6 w-full">
      <app-sign-up-form />
    </div>

    <span appSeparator></span>

    <p class="mt-2">Or log in with:</p>

    <button class="w-full" type="button" appButton variant="border">
      <img src="/google.svg" alt="google" />
      Google
    </button>

    <span appSeparator></span>

    <p>Already have an account? <a class="text-neutral-950" routerLink="/auth/login">Login</a></p>
  </div>
</app-auth-view>
